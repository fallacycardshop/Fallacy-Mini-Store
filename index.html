<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fallacy's Mini Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* 🌸 Pastel Pink Theme */
:root {
  --pink-bg: #ffeef5;
  --pink-main: #ffbcd4;
  --pink-accent: #ff8fb3;
  --pink-soft: #ffe3ec;
  --pink-border: #ffd6e8;
  --text-main: #333;
  --text-soft: #777;
}
body {
  margin: 0;
  background: var(--pink-bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-main);
}
header {
  background: var(--pink-main);
  padding: 14px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 10;
}
main {
  padding: 16px;
  padding-bottom: 80px;
}
h2 {
  color: #d14f7b;
}

/* Toolbar */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.toolbar input, .toolbar select {
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--pink-border);
  font-size: 14px;
}

/* Product list */
.product-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.product-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  gap: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.product-card img {
  width: 80px;
  height: 80px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid var(--pink-border);
}
.product-info {
  flex: 1;
}
.product-name {
  font-size: 15px;
  font-weight: 600;
}
.product-price {
  font-size: 14px;
  color: #d14f7b;
}
.product-desc {
  font-size: 12px;
  color: var(--text-soft);
}

/* Buttons */
.btn {
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}
.btn-primary {
  background: var(--pink-accent);
  color: #fff;
}
.btn-secondary {
  background: var(--pink-soft);
  color: #d14f7b;
}

/* Cart */
#cartScreen, #paynowScreen {
  display: none;
}
.cart-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cart-item {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  gap: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.cart-item img {
  width: 70px;
  height: 70px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid var(--pink-border);
}
.quantity-control {
  display: flex;
  gap: 8px;
  align-items: center;
}
.quantity-control button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: var(--pink-soft);
  color: #d14f7b;
  font-weight: bold;
}

/* Total box */
.total-box {
  background: #fff;
  padding: 12px;
  border-radius: 12px;
  margin-top: 16px;
}

/* Checkout */
.checkout-section {
  background: #fff;
  padding: 14px;
  border-radius: 12px;
  margin-top: 16px;
}
.form-row {
  margin-bottom: 10px;
}
.form-row input, .form-row textarea {
  width: 100%;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--pink-border);
}

/* Footer */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--pink-main);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  color: #fff;
}
</style>
</head>

<body>

<header>Fallacy's Mini Store</header>

<main>

<!-- PRODUCT SCREEN -->
<section id="productsScreen">
  <h2>Products</h2>

  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="Search cards...">
    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
  </div>

  <div class="product-list" id="productList"></div>
</section>

<!-- CART SCREEN -->
<section id="cartScreen">
  <h2>Your Cart</h2>
  <div class="cart-list" id="cartList"></div>

  <div class="total-box" id="totalBox" style="display:none;">
    <div class="total-row"><span>Subtotal</span><span id="subtotalText">$0.00</span></div>
    <div class="total-row"><span>Shipping</span><span id="shippingText">$0.00</span></div>
    <div class="total-row" style="font-weight:700;"><span>Total</span><span id="totalText">$0.00</span></div>
  </div>

  <div class="checkout-section" id="checkoutSection" style="display:none;">
    <h3>Checkout</h3>

    <div class="form-row">
      <label>Name</label>
      <input id="nameInput" type="text">
    </div>

    <div class="form-row">
      <label>Phone</label>
      <input id="phoneInput" type="text">
    </div>

    <div class="form-row">
      <label>Address</label>
      <textarea id="addressInput" rows="2"></textarea>
    </div>

    <button class="btn btn-primary" id="checkoutButton">Proceed to PayNow</button>
  </div>
</section>

<!-- PAYNOW SCREEN -->
<section id="paynowScreen">
  <h2>PayNow Payment</h2>

  <div style="background:#fff;padding:16px;border-radius:12px;text-align:center;">
    <p>Scan the QR code below to make payment</p>

    <img src="YOUR_PAYNOW_QR_LINK"
         style="width:220px;height:220px;border-radius:12px;border:3px solid var(--pink-border);">

    <p>
      Or pay to:<br>
      <strong>UEN: YOUR_UEN</strong><br>
      <strong>Mobile: YOUR_PHONE</strong>
    </p>

    <p style="font-size:16px;font-weight:700;">
      Amount: <span id="paynowAmount">$0.00</span>
    </p>

    <button class="btn btn-primary" id="paynowConfirmButton">I have paid</button>
  </div>
</section>

</main>

<footer>
  <span id="footerText">Browsing products</span>
  <button class="btn btn-secondary" id="cartButton">Cart (0)</button>
</footer>

<script>
let products = [];
let cart = JSON.parse(localStorage.getItem("fallacyCart") || "{}");

function saveCart() {
  localStorage.setItem("fallacyCart", JSON.stringify(cart));
}

async function loadProducts() {
  const res = await fetch("/api/products");
  products = await res.json();
  renderCategoryFilter();
  renderProducts();
}

function renderCategoryFilter() {
  const categories = [...new Set(products.map(p => p.category))];
  const filter = document.getElementById("categoryFilter");
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    filter.appendChild(opt);
  });
}

function renderProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  const search = document.getElementById("searchInput").value.toLowerCase();
  const category = document.getElementById("categoryFilter").value;

  products
    .filter(p =>
      (!search || p.name.toLowerCase().includes(search)) &&
      (!category || p.category === category)
    )
    .forEach(p => {
      const card = document.createElement("div");
      card.className = "product-card";

      card.innerHTML = `
        <img src="${p.photo}">
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-price">$${p.price.toFixed(2)}</div>
          <div class="product-desc">${p.description}</div>
          <div class="product-desc">Stock: ${p.stock}</div>
        </div>
        <button class="btn btn-primary">Add to cart</button>
      `;

      card.querySelector("button").onclick = () => addToCart(p);
      list.appendChild(card);
    });
}

function addToCart(product) {
  if (!cart[product.id]) {
    cart[product.id] = { product, quantity: 0 };
  }
  if (cart[product.id].quantity >= product.stock) {
    alert("Not enough stock.");
    return;
  }
  cart[product.id].quantity++;
  saveCart();
  updateCartBadge();
}

function updateCartBadge() {
  const count = Object.values(cart).reduce((s, i) => s + i.quantity, 0);
  document.getElementById("cartButton").textContent = `Cart (${count})`;
}

function showCart() {
  document.getElementById("productsScreen").style.display = "none";
  document.getElementById("cartScreen").style.display = "block";
  document.getElementById("paynowScreen").style.display = "none";
  renderCart();
}

function showProducts() {
  document.getElementById("productsScreen").style.display = "block";
  document.getElementById("cartScreen").style.display = "none";
  document.getElementById("paynowScreen").style.display = "none";
}

function showPayNow() {
  document.getElementById("productsScreen").style.display = "none";
  document.getElementById("cartScreen").style.display = "none";
  document.getElementById("paynowScreen").style.display = "block";
}

function renderCart() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  const items = Object.values(cart);
  if (items.length === 0) {
    list.innerHTML = "<p>Your cart is empty.</p>";
    document.getElementById("totalBox").style.display = "none";
    document.getElementById("checkoutSection").style.display = "none";
    return;
  }

  let subtotal = 0;

  items.forEach(({ product, quantity }) => {
    subtotal += product.price * quantity;

    const item = document.createElement("div");
    item.className = "cart-item";

    item.innerHTML = `
      <img src="${product.photo}">
      <div class="cart-info">
        <div class="product-name">${product.name}</div>
        <div class="product-price">$${product.price.toFixed(2)} × ${quantity}</div>
        <div class="product-desc">Stock left: ${product.stock - quantity}</div>
      </div>
      <div class="cart-actions">
        <div class="quantity-control">
          <button>-</button>
          <span>${quantity}</span>
          <button>+</button>
        </div>
        <button class="btn btn-secondary">Remove</button>
      </div>
    `;

    const [minus, , plus] = item.querySelectorAll(".quantity-control button");
    minus.onclick = () => changeQuantity(product.id, -1);
    plus.onclick = () => changeQuantity(product.id, 1);
    item.querySelector(".btn-secondary").onclick = () => removeItem(product.id);

    list.appendChild(item);
  });

  const shipping = subtotal > 0 ? 5 : 0;
  const total = subtotal + shipping;

  document.getElementById("subtotalText").textContent = `$${subtotal.toFixed(2)}`;
  document.getElementById("shippingText").textContent = `$${shipping.toFixed(2)}`;
  document.getElementById("totalText").textContent = `$${total.toFixed(2)}`;

  document.getElementById("totalBox").style.display = "block";
  document.getElementById("checkoutSection").style.display = "block";
}

function changeQuantity(id, delta) {
  if (!cart[id]) return;
  const product = cart[id].product;
  const newQty = cart[id].quantity + delta;

  if (newQty > product.stock) {
    alert("Not enough stock.");
    return;
  }

  cart[id].quantity = newQty;
  if (newQty <= 0) delete cart[id];
  saveCart();
  renderCart();
  updateCartBadge();
}

function removeItem(id) {
  delete cart[id];
  saveCart();
  renderCart();
  updateCartBadge();
}

document.getElementById("cartButton").onclick = showCart;

  const name = document.getElementById("nameInput").value.trim();
  const phone =
