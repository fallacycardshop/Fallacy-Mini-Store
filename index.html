<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fallacy's Mini Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* 🌸 GLOBAL STYLES — Pastel Pink Theme */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  background: #ffeef5; /* pastel pink */
  color: #333;
}

/* HEADER */
header {
  background: #ffbcd4;
  padding: 14px;
  text-align: center;
  font-weight: 700;
  font-size: 20px;
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* MAIN CONTAINER */
main {
  padding: 16px;
}

/* PRODUCT LIST */
.product-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.product-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  gap: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.product-card img {
  width: 80px;
  height: 80px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid #ffd6e8;
}

.product-info {
  flex: 1;
}

.product-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}

.product-price {
  font-size: 14px;
  color: #d14f7b;
  margin-bottom: 6px;
}

.product-desc {
  font-size: 12px;
  color: #777;
}

/* BUTTONS */
.btn {
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.btn-primary {
  background: #ff8fb3;
  color: #fff;
}

.btn-secondary {
  background: #ffe3ec;
  color: #d14f7b;
}

/* CART */
#cartScreen {
  display: none;
}

.cart-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.cart-item {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  gap: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.cart-item img {
  width: 70px;
  height: 70px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid #ffd6e8;
}

.quantity-control {
  display: flex;
  gap: 8px;
  align-items: center;
}

.quantity-control button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: #ffe3ec;
  color: #d14f7b;
  font-weight: bold;
  cursor: pointer;
}

/* TOTAL BOX */
.total-box {
  background: #fff;
  padding: 12px;
  border-radius: 12px;
  margin-top: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.total-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 15px;
}

/* CHECKOUT */
.checkout-section {
  background: #fff;
  padding: 14px;
  border-radius: 12px;
  margin-top: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.form-row {
  margin-bottom: 10px;
}

.form-row label {
  font-size: 13px;
  margin-bottom: 4px;
  display: block;
}

.form-row input, .form-row textarea {
  width: 100%;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid #ffd6e8;
  font-size: 14px;
  box-sizing: border-box;
}

/* FOOTER */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ffbcd4;
  padding: 12px;
  text-align: center;
  color: #fff;
  font-size: 14px;
}

/* 🌸 MOBILE-FIRST MEDIA QUERIES */
@media (max-width: 480px) {
  .product-card, .cart-item {
    flex-direction: column;
    text-align: center;
  }
  .product-card img, .cart-item img {
    margin: 0 auto;
  }
  .product-actions, .cart-actions {
    text-align: center;
  }
}
</style>
</head>

<body>

<header>Fallacy's Mini Store</header>

<main>

<!-- PRODUCT SCREEN -->
<section id="productsScreen">
  <h2 style="color:#d14f7b;">Products</h2>
  <div class="product-list" id="productList"></div>
</section>

<!-- CART SCREEN -->
<section id="cartScreen">
  <h2 style="color:#d14f7b;">Your Cart</h2>
  <div class="cart-list" id="cartList"></div>

  <div class="total-box" id="totalBox" style="display:none;">
    <div class="total-row"><span>Subtotal</span><span id="subtotalText">$0.00</span></div>
    <div class="total-row"><span>Shipping</span><span id="shippingText">$0.00</span></div>
    <div class="total-row" style="font-weight:700;"><span>Total</span><span id="totalText">$0.00</span></div>
  </div>

  <div class="checkout-section" id="checkoutSection" style="display:none;">
    <h3 style="color:#d14f7b;">Checkout</h3>

    <div class="form-row">
      <label>Name</label>
      <input id="nameInput" type="text">
    </div>

    <div class="form-row">
      <label>Phone</label>
      <input id="phoneInput" type="text">
    </div>

    <div class="form-row">
      <label>Address</label>
      <textarea id="addressInput" rows="2"></textarea>
    </div>

    <button class="btn btn-primary" id="checkoutButton">Confirm Order</button>
  </div>
</section>

</main>

<footer>
  <button class="btn btn-secondary" id="cartButton">Cart (0)</button>
</footer>

<script>
/* 🌸 SAMPLE PRODUCTS — Replace with your real inventory */
const products = [
  {
    id: 1,
    name: "Charizard VMAX 074/073",
    price: 45,
    photo: "https://via.placeholder.com/100?text=Charizard",
    description: "NM rainbow rare"
  },
  {
    id: 2,
    name: "Zoro OP01-001 SR",
    price: 12,
    photo: "https://via.placeholder.com/100?text=Zoro",
    description: "LP, SR"
  },
  {
    id: 3,
    name: "Sol Ring Commander",
    price: 8,
    photo: "https://via.placeholder.com/100?text=Sol+Ring",
    description: "NM"
  }
];

/* 🌸 CART STORED IN LOCAL STORAGE */
let cart = JSON.parse(localStorage.getItem("fallacyCart") || "{}");

function saveCart() {
  localStorage.setItem("fallacyCart", JSON.stringify(cart));
}

/* 🌸 RENDER PRODUCTS */
function renderProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  products.forEach(p => {
    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
      <img src="${p.photo}">
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">$${p.price.toFixed(2)}</div>
        <div class="product-desc">${p.description}</div>
      </div>
      <div class="product-actions">
        <button class="btn btn-primary">Add to cart</button>
      </div>
    `;

    card.querySelector("button").onclick = () => addToCart(p);
    list.appendChild(card);
  });
}

/* 🌸 CART FUNCTIONS */
function addToCart(product) {
  if (!cart[product.id]) {
    cart[product.id] = { product, quantity: 0 };
  }
  cart[product.id].quantity++;
  saveCart();
  updateCartBadge();
}

function updateCartBadge() {
  const count = Object.values(cart).reduce((sum, item) => sum + item.quantity, 0);
  document.getElementById("cartButton").textContent = `Cart (${count})`;
}

/* 🌸 RENDER CART */
function renderCart() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  const items = Object.values(cart);
  if (items.length === 0) {
    list.innerHTML = `<p style="text-align:center;color:#777;">Your cart is empty.</p>`;
    document.getElementById("totalBox").style.display = "none";
    document.getElementById("checkoutSection").style.display = "none";
    return;
  }

  let subtotal = 0;

  items.forEach(({ product, quantity }) => {
    subtotal += product.price * quantity;

    const item = document.createElement("div");
    item.className = "cart-item";

    item.innerHTML = `
      <img src="${product.photo}">
      <div class="cart-info">
        <div class="product-name">${product.name}</div>
        <div class="product-price">$${product.price.toFixed(2)} × ${quantity}</div>
      </div>
      <div class="cart-actions">
        <div class="quantity-control">
          <button>-</button>
          <span>${quantity}</span>
          <button>+</button>
        </div>
        <button class="btn btn-secondary">Remove</button>
      </div>
    `;

    const [minus, , plus] = item.querySelectorAll(".quantity-control button");
    minus.onclick = () => changeQuantity(product.id, -1);
    plus.onclick = () => changeQuantity(product.id, 1);

    item.querySelector(".btn-secondary").onclick = () => removeItem(product.id);

    list.appendChild(item);
  });

  const shipping = subtotal > 0 ? 5 : 0;
  const total = subtotal + shipping;

  document.getElementById("subtotalText").textContent = `$${subtotal.toFixed(2)}`;
  document.getElementById("shippingText").textContent = `$${shipping.toFixed(2)}`;
  document.getElementById("totalText").textContent = `$${total.toFixed(2)}`;

  document.getElementById("totalBox").style.display = "block";
  document.getElementById("checkoutSection").style.display = "block";
}

function changeQuantity(id, delta) {
  if (!cart[id]) return;
  cart[id].quantity += delta;
  if (cart[id].quantity <= 0) delete cart[id];
  saveCart();
  renderCart();
  updateCartBadge();
}

function removeItem(id) {
  delete cart[id];
  saveCart();
  renderCart();
  updateCartBadge();
}

/* 🌸 SCREEN SWITCHING */
document.getElementById("cartButton").onclick = () => {
  document.getElementById("productsScreen").style.display = "none";
  document.getElementById("cartScreen").style.display = "block";
  renderCart();
};

function showProducts() {
  document.getElementById("productsScreen").style.display = "block";
  document.getElementById("cartScreen").style.display = "none";
}

/* 🌸 CHECKOUT */
document.getElementById("checkoutButton").onclick = () => {
  const name = document.getElementById("nameInput").value.trim();
  const phone = document.getElementById("phoneInput").value.trim();
  const address = document.getElementById("addressInput").value.trim();

  if (!name || !phone || !address) {
    alert("Please fill in all fields.");
    return;
  }

  alert("Order confirmed! (Demo only)");
  cart = {};
  saveCart();
  updateCartBadge();
  showProducts();
};

/* 🌸 INIT */
renderProducts();
updateCartBadge();
</script>

</body>
</html>
