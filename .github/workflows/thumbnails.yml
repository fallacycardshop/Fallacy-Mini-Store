name: Generate thumbnails

# Whenever full-size card images are added OR replaced in images/ (including via
# GitHub's "Add files via upload" button), rebuild the matching thumbnails and
# commit them back. The store serves thumbnails from raw.githubusercontent.com/
# main, so they must physically live in the repo — this keeps them in step with
# the full scans without anyone running a script by hand.
#
# A REPLACED image keeps its filename, so its thumbnail already exists; the job
# therefore force-rebuilds the thumbnail of every image CHANGED in the push (not
# just the missing ones), which is what fixes "the store still shows the old
# picture after I replaced it".
on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "!images/thumbs/**" # the bot's own thumbnail commits must not retrigger
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild ALL thumbnails (not just changed/missing)"
        type: boolean
        default: false

# Never let two runs race on pushing thumbnails back to the same branch.
concurrency:
  group: thumbnails-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the generated thumbnails back to main

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff this push's changed images

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Rebuild thumbnails
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_all }}" = "true" ]; then
            echo "Manual full rebuild of every thumbnail."
            python scripts/make_thumbs.py --force
          else
            # Force-rebuild the thumbnail of every full image changed in this push
            # (added or modified; deletions are skipped — there's nothing to thumb).
            BEFORE="${{ github.event.before }}"
            CHANGED=""
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only --diff-filter=d "$BEFORE" "${{ github.sha }}" -- images \
                        | grep -viE '^images/thumbs/' | grep -iE '\.(jpe?g|png)$' || true)
            fi
            if [ -n "$CHANGED" ]; then
              echo "Changed images in this push:"
              echo "$CHANGED"
              echo "$CHANGED" | xargs -d '\n' python scripts/make_thumbs.py
            else
              echo "No changed full images detected in this push."
            fi
            # Always also fill in any genuinely missing thumbnails.
            python scripts/make_thumbs.py
          fi

      - name: Commit updated thumbnails
        run: |
          if [ -z "$(git status --porcelain images/thumbs)" ]; then
            echo "No thumbnail changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/thumbs
          git commit -m "Auto-generate/refresh card thumbnails"
          git push
